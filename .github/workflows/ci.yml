name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Verify Code and Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        pip install pytest httpx

    - name: Verify wrapper imports and run unit/API tests
      run: |
        export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/modules/Dental_002/src:${GITHUB_WORKSPACE}/modules/Dental_003:${GITHUB_WORKSPACE}/modules/Dental_004/src:${GITHUB_WORKSPACE}/modules/Dental_008/src:${GITHUB_WORKSPACE}/modules/Dental_Core"
        python -c "from modules.registry import PredictorRegistry; from modules.caries_predictor import CariesPredictorWrapper; from modules.boneloss_predictor import BoneLossPredictorWrapper; from modules.periapical_predictor import PeriapicalPredictorWrapper; from modules.restoration_predictor import RestorationPredictorWrapper; from modules.age_predictor import AgePredictorWrapper; print('Sanity check passed!')"
        pytest tests -v

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Docker image
      run: |
        docker build -t panoramic-reader:latest .
